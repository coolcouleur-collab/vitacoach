<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#C87B52" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Solenn" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="167x167" href="/icons/ios-167.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/icons/ios-152.png" />
    <link rel="apple-touch-icon" sizes="120x120" href="/icons/ios-120.png" />
    <link rel="icon" type="image/svg+xml" href="/icon-master.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />

    <!-- SEO & Open Graph -->
    <meta name="description" content="Ton coach de vie personnel IA — nutrition, sommeil, style & bien-être sur mesure." />
    <meta property="og:title" content="Solenn" />
    <meta property="og:description" content="Ton coach de vie personnel IA" />
    <meta property="og:type" content="website" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&family=DM+Sans:wght@300;400;500&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&display=swap" rel="stylesheet">
    <style>
      *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { background: #FFF8F4; overflow-x: hidden; color: rgba(255,238,220,0.92); }
      #root { min-height: 100vh; }

      @keyframes twinkle {
        from { opacity: 0.08; transform: scale(0.7); }
        to   { opacity: 0.9;  transform: scale(1.4); }
      }
      @keyframes floatOrb {
        0%,100% { transform: translateY(0px) scale(1); }
        50%      { transform: translateY(-18px) scale(1.04); }
      }
      @keyframes slideUp {
        from { opacity: 0; transform: translateY(20px); }
        to   { opacity: 1; transform: translateY(0); }
      }
      @keyframes fadeIn {
        from { opacity: 0; }
        to   { opacity: 1; }
      }
      @keyframes collapseGlow {
        0%,100% { box-shadow: 0 0 0 4px rgba(200,123,82,0.10), 0 0 14px rgba(200,123,82,0.55), 0 0 32px rgba(232,160,122,0.25), inset 0 0 10px rgba(255,200,140,0.22); }
        50%     { box-shadow: 0 0 0 6px rgba(200,123,82,0.18), 0 0 22px rgba(200,123,82,0.85), 0 0 52px rgba(232,160,122,0.50), inset 0 0 14px rgba(255,200,140,0.38); }
      }

      input:-webkit-autofill,
      input:-webkit-autofill:hover,
      input:-webkit-autofill:focus,
      input:-webkit-autofill:active {
        -webkit-box-shadow: 0 0 0px 1000px rgba(210,155,85,0.28) inset !important;
        -webkit-text-fill-color: rgba(255,248,235,1) !important;
        caret-color: rgba(255,248,235,1) !important;
        transition: background-color 5000s ease-in-out 0s !important;
      }
      select option { background: #1a0f08; color: rgba(255,238,220,0.92); }

      ::-webkit-scrollbar { width: 0; background: transparent; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
