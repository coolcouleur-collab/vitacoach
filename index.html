<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Solenn — re·vivre · évoluer</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&display=swap" rel="stylesheet">
    <style>
      *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { background: #FFF8F4; overflow-x: hidden; color: #1a0a00; }
      #root { min-height: 100vh; }

      @keyframes twinkle {
        from { opacity: 0.08; transform: scale(0.7); }
        to   { opacity: 0.9;  transform: scale(1.4); }
      }
      @keyframes floatOrb {
        0%,100% { transform: translateY(0px) scale(1); }
        50%      { transform: translateY(-18px) scale(1.04); }
      }
      @keyframes slideUp {
        from { opacity: 0; transform: translateY(20px); }
        to   { opacity: 1; transform: translateY(0); }
      }
      @keyframes fadeIn {
        from { opacity: 0; }
        to   { opacity: 1; }
      }
      @keyframes pulseNeon {
        0%,100% { box-shadow: 0 0 8px rgba(255,107,53,0.4); }
        50%     { box-shadow: 0 0 24px rgba(255,107,53,0.9), 0 0 48px rgba(255,107,53,0.3); }
      }
      @keyframes collapseGlow {
        0%,100% { box-shadow: 0 0 0 4px rgba(200,123,82,0.10), 0 0 14px rgba(200,123,82,0.55), 0 0 32px rgba(232,160,122,0.25), inset 0 0 10px rgba(255,200,140,0.22); }
        50%     { box-shadow: 0 0 0 6px rgba(200,123,82,0.18), 0 0 22px rgba(200,123,82,0.85), 0 0 52px rgba(232,160,122,0.50), inset 0 0 14px rgba(255,200,140,0.38); }
      }

      input::placeholder { color: rgba(255,255,255,0.22); }
      textarea::placeholder { color: rgba(255,255,255,0.22); }
      select option { background: #1a0a00; color: white; }

      ::-webkit-scrollbar { width: 0; background: transparent; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
