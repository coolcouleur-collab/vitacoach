name: Deploy Elio → VPS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy sur le VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 152.228.131.218
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            STATUS="/var/www/html/deploy-status.txt"
            echo "STEP_CD" > $STATUS

            cd /home/ubuntu/vitacoach || { echo "FAIL_CD" > $STATUS; exit 1; }
            echo "STEP_GIT" > $STATUS

            git fetch origin main 2>&1 || { echo "FAIL_GIT_FETCH" > $STATUS; exit 1; }
            git reset --hard origin/main 2>&1 || { echo "FAIL_GIT_RESET" > $STATUS; exit 1; }
            echo "STEP_NPM_INSTALL" > $STATUS

            npm install 2>&1 | tail -3 || { echo "FAIL_NPM_INSTALL" > $STATUS; exit 1; }
            echo "STEP_BUILD" > $STATUS

            NODE_OPTIONS="--max-old-space-size=512" npm run build 2>&1 | tail -5
            BUILD_EXIT=$?
            if [ $BUILD_EXIT -ne 0 ]; then
              echo "FAIL_BUILD_exit$BUILD_EXIT" > $STATUS
              exit 1
            fi

            echo "STEP_COPY" > $STATUS
            cp -r dist/. /var/www/html/
            echo "STEP_PM2" > $STATUS

            pm2 restart oravia 2>&1 || true
            echo "SUCCESS_$(git log --oneline -1 | cut -c1-7)" > $STATUS
