name: Deploy Elio → VPS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy sur le VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 152.228.131.218
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            LOG="/tmp/deploy_diag.txt"
            echo "=== DEPLOY DIAG $(date) ===" > $LOG

            echo "--- whoami ---" >> $LOG
            whoami >> $LOG 2>&1

            echo "--- pwd ---" >> $LOG
            pwd >> $LOG 2>&1

            echo "--- ls /home/ubuntu/ ---" >> $LOG
            ls /home/ubuntu/ >> $LOG 2>&1 || echo "FAILED ls /home/ubuntu" >> $LOG

            echo "--- ls /root/ ---" >> $LOG
            ls /root/ >> $LOG 2>&1 || echo "FAILED ls /root" >> $LOG

            echo "--- nginx sites-enabled ---" >> $LOG
            cat /etc/nginx/sites-enabled/* >> $LOG 2>&1 || echo "FAILED nginx sites" >> $LOG

            echo "--- nginx conf.d ---" >> $LOG
            ls /etc/nginx/conf.d/ >> $LOG 2>&1 || true
            cat /etc/nginx/conf.d/* >> $LOG 2>&1 || true

            echo "--- pm2 list ---" >> $LOG
            pm2 list >> $LOG 2>&1 || echo "FAILED pm2" >> $LOG

            echo "--- node/npm versions ---" >> $LOG
            node --version >> $LOG 2>&1
            npm --version >> $LOG 2>&1

            # Copie du log dans toutes les racines possibles
            cp $LOG /var/www/html/deploy-diag.txt 2>/dev/null || true
            cp $LOG /home/ubuntu/vitacoach/dist/deploy-diag.txt 2>/dev/null || true
            cp $LOG /usr/share/nginx/html/deploy-diag.txt 2>/dev/null || true

            echo "=== FIN ===" >> $LOG
            cat $LOG
