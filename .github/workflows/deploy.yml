name: Deploy Elio → VPS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy sur le VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 152.228.131.218
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /home/ubuntu/vitacoach
            git pull origin main
            npm run build
            pm2 restart oravia
            echo "✅ Elio déployé avec succès !"
