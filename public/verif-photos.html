<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vérification des photos d'exercices</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap');
  body { margin:0; padding:20px 14px 60px; font-family:'Poppins',sans-serif;
         background:#EDD8CC; color:#83400E; }
  h1 { font-size:16px; margin:0 0 4px; }
  p.i { font-size:12.5px; margin:0 0 20px; opacity:.8; }
  .g { display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr));
       gap:14px; max-width:940px; margin:0 auto; }
  .c { background:rgba(255,246,238,0.62); border:1px solid rgba(200,123,82,0.18);
       border-radius:14px; overflow:hidden; }
  /* Recadrage IDENTIQUE a l'app : hauteur 130, objectFit cover */
  .ph { height:130px; background:rgba(255,240,220,0.6); }
  .ph img { width:100%; height:100%; object-fit:cover; object-position:center 50%; display:block; }
  .n { font-size:13px; font-weight:700; padding:9px 11px 2px; }
  .id { font-size:10.5px; opacity:.65; padding:0 11px 10px; }
</style>
<h1>Neuf candidates, au recadrage réel de l'app</h1>
<p class="i">Hauteur 130px, recadrage centré, exactement comme dans la bibliothèque.</p>
<div class="g" id="g"></div>
<script>
  const P = id => `https://images.pexels.com/photos/${id}/pexels-photo-${id}.jpeg?auto=compress&cs=tinysrgb&dpr=2&h=650&w=940`;
  const L = [
    ['Mountain climber','2294361'],
    ['Planche latérale','2294363'],
    ['Crunch','3930989'],
    ['Mollets','13965339'],
    ['Leg raise','14942844'],
    ['Russian twist','5128466'],
    ['Step-up','13896897'],
    ['Jumping jack','6339477'],
    ['Genoux hauts','6339342'],
  ];
  document.getElementById('g').innerHTML = L.map(([n,id]) =>
    `<div class="c"><div class="ph"><img src="${P(id)}" alt="${n}"></div>
     <div class="n">${n}</div><div class="id">Pexels ${id}</div></div>`).join('');
</script>
