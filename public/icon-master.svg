<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Fond : gradient radial orbe chaud -->
    <radialGradient id="bgGradient" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%"   stop-color="#C87B52"/>
      <stop offset="100%" stop-color="#1a0a00"/>
    </radialGradient>

    <!-- Glow intérieur blanc sur le cercle principal -->
    <radialGradient id="innerGlow" cx="50%" cy="40%" r="55%" fx="50%" fy="38%">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <!-- Filtre glow pour la lettre S -->
    <filter id="sGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Fond circulaire avec gradient orbe -->
  <circle cx="512" cy="512" r="512" fill="url(#bgGradient)"/>

  <!-- Glow intérieur blanc -->
  <circle cx="512" cy="512" r="512" fill="url(#innerGlow)"/>

  <!-- Halo lumineux elliptique derrière le S -->
  <ellipse cx="512" cy="520" rx="280" ry="340" fill="#ffffff" opacity="0.15"/>

  <!-- Bordure subtile dorée -->
  <circle cx="512" cy="512" r="502" fill="none" stroke="rgba(255,220,160,0.30)" stroke-width="3"/>

  <!-- Lettre S centrale — Cormorant Garamond italic -->
  <text
    x="512"
    y="695"
    font-family="'Cormorant Garamond', 'Cormorant', Georgia, serif"
    font-style="italic"
    font-weight="600"
    font-size="520"
    text-anchor="middle"
    fill="rgba(255,240,210,0.95)"
    filter="url(#sGlow)"
  >S</text>
</svg>
